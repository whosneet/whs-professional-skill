name: Validate and package skill
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate skill (frontmatter, reference + section links, regressions, hygiene, AU English)
        run: python3 scripts/validate.py
      - name: Guard against real-organisation content in the skill
        run: |
          # Extend this pattern with any identifier that must never ship in a
          # release. Word-boundary match so e.g. "landowner" does not trip it.
          if grep -rniE '\bdowner\b|\bsics\b' whs-professional/; then
            echo "::error::Skill folder contains real-organisation identifiers. Replace with the fictional worked example before release."
            exit 1
          fi
  package:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify SKILL.md version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version:' whs-professional/SKILL.md | awk '{print $2}')
          echo "tag=$TAG skill=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::SKILL.md version ($VER) does not match tag ($GITHUB_REF_NAME). Bump the frontmatter before tagging."
            exit 1
          fi
      - name: Build clean skill archive
        run: |
          zip -r whs-professional.zip whs-professional -x "*.DS_Store" -x "__MACOSX/*"
          cp whs-professional.zip whs-professional.skill
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whs-professional-skill
          path: |
            whs-professional.zip
            whs-professional.skill
      - name: Attach artefacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whs-professional.zip
            whs-professional.skill
